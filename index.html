<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quanto custa usado — Preço médio de celulares usados</title>
<style>
:root{--bg:#fafafa;--card:#ffffff;--text:#111827;--muted:#6b7280;--border:#e5e7eb;--accent:#111827;--green:#059669}
*{box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;margin:0;background:var(--bg);color:var(--text)}.wrap{max-width:960px;margin:0 auto;padding:64px 20px 64px}h1{margin:0;font-size:120px;font-weight:800;letter-spacing:-0.04em;line-height:1.05}p.sub{margin:16px 0 0;color:var(--muted);font-size:22px}.search{display:flex;gap:10px;margin-top:48px}input{flex:1;padding:18px 22px;border-radius:14px;border:1px solid var(--border);background:var(--card);color:var(--text);font-size:17px;outline:none}input:focus{border-color:var(--accent)}button{padding:18px 32px;border-radius:14px;border:none;background:var(--accent);color:#fff;font-size:16px;font-weight:600;cursor:pointer}button:hover{opacity:.9}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px;margin-top:48px}.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:24px;transition:box-shadow .15s}.card:hover{box-shadow:0 4px 12px rgba(0,0,0,.06)}.card h3{margin:0 0 2px;font-size:17px;font-weight:600}.var{color:var(--muted);font-size:14px;margin-bottom:16px}.price{font-size:28px;font-weight:700;color:var(--green);letter-spacing:-0.02em}.range{color:var(--muted);font-size:14px;margin-top:6px}.meta{margin-top:16px;padding-top:12px;border-top:1px solid var(--border);font-size:12px;color:var(--muted)}.badge{display:inline-block;padding:2px 10px;border-radius:999px;background:#f3f4f6;color:var(--muted);font-size:12px}.empty{color:var(--muted);text-align:center;margin-top:48px}.err{color:#dc2626;text-align:center;margin-top:48px;white-space:pre-wrap}
@media(max-width:900px){h1{font-size:72px}p.sub{font-size:20px}}
@media(max-width:520px){h1{font-size:48px}p.sub{font-size:18px}.search{flex-direction:column}button{width:100%}}
</style>
</head>
<body>
<div class="wrap">
<h1>Quanto custa usado</h1>
<p class="sub">Descubra o preço médio de celulares usados no Brasil</p>
<form class="search" id="form"><input id="q" placeholder="Busque por modelo, ex.: Galaxy S24, iPhone 15..." autocomplete="off"><button type="submit">Pesquisar</button></form>
<div class="grid" id="grid"></div>
<div class="empty" id="empty">Carregando preços...</div>
</div>
<script>
const SUPABASE_URL='https://zoikvfhqhbwkbrpaevru.supabase.co';
const KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpvaWt2ZmhxaGJ3a2JycGFldnJ1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIzMDYxNDcsImV4cCI6MjEwNzg4MjE0N30.rTbru1_NYr7nhbyKBq2S_dYMWZjhPq5CaBNeS7UFPd8';
const H={apikey:KEY,Authorization:'Bearer '+KEY};
let items=[];
async function getJSON(url){const r=await fetch(url,{headers:H});const j=await r.json();if(!Array.isArray(j))throw new Error('Supabase respondeu: '+JSON.stringify(j));return j;}
async function load(){try{const[avs,prods]=await Promise.all([getJSON(SUPABASE_URL+'/rest/v1/avaliacoes?select=*&order=calculado_em.desc'),getJSON(SUPABASE_URL+'/rest/v1/produtos?select=*')]);const byId={};prods.forEach(p=>byId[p.id]=p);const seen={};items=avs.filter(a=>{if(seen[a.produto_id])return false;seen[a.produto_id]=1;return byId[a.produto_id];}).map(a=>({...a,produto:byId[a.produto_id]}));render('');}catch(e){const el=document.getElementById('empty');el.className='err';el.style.display='block';el.textContent='Erro ao carregar preços: '+e.message;}}
function render(q){const grid=document.getElementById('grid');const t=q.trim().toLowerCase();const list=items.filter(a=>(a.produto.marca+' '+a.produto.modelo+' '+a.produto.variante).toLowerCase().includes(t));grid.innerHTML=list.map(a=>`<div class="card"><h3>${a.produto.marca} ${a.produto.modelo}</h3><div class="var">${a.produto.variante}</div><div class="price">R$ ${Number(a.mediana).toLocaleString('pt-BR',{minimumFractionDigits:2})}</div><div class="range">Faixa: R$ ${Number(a.faixa_min).toLocaleString('pt-BR')} – R$ ${Number(a.faixa_max).toLocaleString('pt-BR')}</div><div class="meta"><span class="badge">confiança ${a.confianca}</span> · ${a.quantidade_ofertas} ofertas · atualizado em ${new Date(a.calculado_em).toLocaleDateString('pt-BR')}</div></div>`).join('');const el=document.getElementById('empty');el.style.display=list.length?'none':'block';if(!list.length){el.className='empty';el.textContent='Nenhum modelo encontrado. Tente outro termo.';}}
document.getElementById('form').addEventListener('submit',e=>{e.preventDefault();render(document.getElementById('q').value);});
document.getElementById('q').addEventListener('input',e=>render(e.target.value));
load();
</script>
</body>
</html>
