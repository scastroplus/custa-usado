<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Custa Usado — Preço médio de celulares usados</title>
<style>
*{box-sizing:border-box}body{font-family:system-ui,sans-serif;margin:0;background:#0f172a;color:#e2e8f0}header{padding:32px 16px;text-align:center}h1{margin:0 0 8px;font-size:28px}p.sub{margin:0;color:#94a3b8}.wrap{max-width:900px;margin:0 auto;padding:0 16px 48px}input{width:100%;padding:14px 16px;border-radius:12px;border:1px solid #334155;background:#1e293b;color:#e2e8f0;font-size:16px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px;margin-top:24px}.card{background:#1e293b;border:1px solid #334155;border-radius:16px;padding:20px}.card h3{margin:0 0 4px;font-size:17px}.card .var{color:#94a3b8;font-size:14px;margin-bottom:12px}.price{font-size:26px;font-weight:700;color:#4ade80}.range{color:#94a3b8;font-size:14px;margin-top:4px}.meta{margin-top:12px;font-size:12px;color:#64748b}.badge{display:inline-block;padding:2px 8px;border-radius:999px;background:#334155;font-size:12px}.empty{color:#94a3b8;text-align:center;margin-top:40px}
</style>
</head>
<body>
<header><h1>Custa Usado</h1><p class="sub">Descubra o preço médio de celulares usados no Brasil</p></header>
<div class="wrap">
<input id="q" placeholder="Busque por modelo, ex.: Galaxy S20, iPhone 13...">
<div class="grid" id="grid"></div>
<div class="empty" id="empty">Carregando preços...</div>
</div>
<script>
const SUPABASE_URL='https://zoikvfhqhbwkbrpaevru.supabase.co';
const KEY='sb_publishable_GO0hIkq2JUZTp2X0o6WRyQ_Oiihxczb';
let items=[];
async function load(){
 const r=await fetch(SUPABASE_URL+'/rest/v1/avaliacoes?select=*,produtos!inner(*)&order=calculado_em.desc',{headers:{apikey:KEY,Authorization:'Bearer '+KEY}});
 const data=await r.json();
 const seen={};
 items=data.filter(a=>{if(seen[a.produto_id])return false;seen[a.produto_id]=1;return true;});
 render('');
}
function render(q){
 const grid=document.getElementById('grid');
 const t=q.trim().toLowerCase();
 const list=items.filter(a=>(a.produtos.marca+' '+a.produtos.modelo+' '+a.produtos.variante).toLowerCase().includes(t));
 grid.innerHTML=list.map(a=>`<div class="card"><h3>${a.produtos.marca} ${a.produtos.modelo}</h3><div class="var">${a.produtos.variante} · <span class="badge">${a.confianca==='media'?'confiança média':a.confianca}</span></div><div class="price">R$ ${Number(a.mediana).toLocaleString('pt-BR',{minimumFractionDigits:2})}</div><div class="range">Faixa: R$ ${Number(a.faixa_min).toLocaleString('pt-BR')} – R$ ${Number(a.faixa_max).toLocaleString('pt-BR')}</div><div class="meta">Baseado em ${a.quantidade_ofertas} ofertas · atualizado em ${new Date(a.calculado_em).toLocaleDateString('pt-BR')}</div></div>`).join('');
 document.getElementById('empty').style.display=list.length?'none':'block';
 if(!list.length)document.getElementById('empty').textContent='Nenhum modelo com preço coletado ainda.';
}
document.getElementById('q').addEventListener('input',e=>render(e.target.value));
load();
</script>
</body>
</html>
